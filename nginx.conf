server {
    listen 80;
    server_name recipebot.duckdns.org www.recipebot.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name recipebot.duckdns.org www.recipebot.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/recipebot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipebot.duckdns.org/privkey.pem;

    # Webhook endpoint for Telegram
    # WEBHOOK_URL=https://recipebot.duckdns.org/webhook
    location /webhook {
        proxy_pass http://bot:8000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: health check
    location /health {
        proxy_pass http://bot:8000/health;
    }
}