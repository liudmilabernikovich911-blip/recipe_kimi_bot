services:
  bot:
    build: .
    container_name: recipe-bot
    restart: always
    env_file: .env
    expose:
      - "8000"
    networks:
      - botnet

  nginx:
    image: nginx:alpine
    container_name: bot-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-data:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - bot
    networks:
      - botnet

  certbot:
    image: certbot/certbot
    container_name: bot-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - botnet

networks:
  botnet:
    driver: bridge

volumes:
  certbot-data: