services:
  - type: web
    name: recipe-deepseek-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:flask_app
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_URL
        value: https://api.deepseek.com/v1/chat/completions
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: WEBHOOK_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
