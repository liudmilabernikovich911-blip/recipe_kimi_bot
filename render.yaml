services:
  - type: web
    name: recipe-kimi-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: KIMI_MODEL
        value: moonshot-v1-8k
      - key: WEBHOOK_URL
        value: https://recipe-kimi-bot.onrender.com/telegram-webhook
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: KIMI_API_KEY
        sync: false
        startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT bot:flask_app