services:
  - type: web
    name: recipe-kimi-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: KIMI_MODEL
        value: moonshot-v1-8k
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
